<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>نكهة الدار</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --gd:#1a4731;--g:#2d6a4f;--gm:#40916c;--gl:#74c69d;--gp:#d8f3dc;
  --go:#f0b429;--gop:#fef9e7;--bei:#f5f0e8;--bm:#ede4d0;
  --wh:#fff;--td:#1a1a2e;--tm:#4a4a5a;--ts:#8a8a9a;
  --rd:#e63946;--ora:#f4a261;
  --r8:8px;--r14:14px;--r22:22px;
  --sh:0 1px 6px rgba(0,0,0,.07);--shm:0 4px 16px rgba(0,0,0,.10);
  --tr:all .22s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Cairo','Tajawal',sans-serif;background:var(--bei);color:var(--td);direction:rtl}
#root{height:100vh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:var(--wh);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.15)}

/* ── HEADER ── */
.hd{background:var(--gd);color:#fff;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hl{display:flex;align-items:center;gap:8px}
.hlm{width:40px;height:40px;background:var(--go);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--gd);line-height:1.2;text-align:center}
.ht{font-size:17px;font-weight:900}
.hs{font-size:9px;color:var(--gl);letter-spacing:.8px}
.ha{display:flex;align-items:center;gap:6px}
.hib{background:rgba(255,255,255,.12);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:17px;transition:var(--tr)}
.hib:hover{background:rgba(255,255,255,.2)}
.cbd{position:relative}
.cbc{position:absolute;top:-5px;left:-5px;background:var(--go);color:var(--gd);font-size:9px;font-weight:900;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ── SCROLL ── */
.ps{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.ps::-webkit-scrollbar{display:none}

/* ── BOTTOM NAV ── */
.bn{display:flex;background:var(--wh);border-top:1px solid var(--bm);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;cursor:pointer;transition:var(--tr);border:none;background:none;color:var(--ts);font-family:inherit;font-size:9px;gap:3px;position:relative}
.ni.active{color:var(--g)}
.nic{font-size:20px;line-height:1}
.nil{font-size:9px;font-weight:600}
.nib{position:absolute;top:6px;right:calc(50% - 16px);background:var(--rd);color:#fff;font-size:8px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ── SEARCH ── */
.sb{padding:12px 16px;background:var(--bei);border-bottom:1px solid var(--bm)}
.siw{background:var(--wh);border-radius:var(--r22);display:flex;align-items:center;gap:8px;padding:10px 14px;box-shadow:var(--sh)}
.siw input{flex:1;border:none;outline:none;font-family:inherit;font-size:14px;background:transparent;color:var(--td)}
.siw input::placeholder{color:var(--ts)}

/* ── SECTION ── */
.sec{padding:16px 16px 0}
.seh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.set{font-size:16px;font-weight:700;color:var(--td)}
.sea{font-size:12px;color:var(--gm);font-weight:600;cursor:pointer;border:none;background:none;font-family:inherit}

/* ── BANNER ── */
.bsc{display:flex;gap:12px;overflow-x:auto;padding:0 16px 16px;scroll-snap-type:x mandatory}
.bsc::-webkit-scrollbar{display:none}
.bc{min-width:90%;background:var(--gd);border-radius:var(--r22);padding:20px;scroll-snap-align:start;position:relative;overflow:hidden;flex-shrink:0}
.bc::before{content:'';position:absolute;top:-30px;left:-30px;width:140px;height:140px;background:rgba(255,255,255,.05);border-radius:50%}
.bc.gold{background:linear-gradient(135deg,var(--go) 0%,#9b7309 100%)}
.bbg{background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:8px}
.btt{font-size:18px;font-weight:900;color:#fff;margin-bottom:4px}
.bst{font-size:12px;color:rgba(255,255,255,.8)}
.bct{margin-top:12px;background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:20px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer;display:inline-block;font-family:inherit}

/* ── CATEGORY CHIPS ── */
.csc{display:flex;gap:8px;overflow-x:auto;padding:0 16px;margin-bottom:16px}
.csc::-webkit-scrollbar{display:none}
.cc{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;padding:8px 10px;border-radius:var(--r14);background:var(--bei);border:1.5px solid transparent;transition:var(--tr);min-width:64px}
.cc.active{background:var(--gp);border-color:var(--gm)}
.cci{font-size:22px}
.ccn{font-size:10px;font-weight:600;color:var(--tm);white-space:nowrap}
.cc.active .ccn{color:var(--g)}

/* ── PRODUCT GRID / SCROLL ── */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.psc{display:flex;gap:10px;overflow-x:auto;padding:0 16px 16px}
.psc::-webkit-scrollbar{display:none}
.psc .pcd{min-width:140px;flex-shrink:0}

/* ── PRODUCT CARD ── */
.pcd{background:var(--wh);border-radius:var(--r14);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:var(--tr);border:1px solid var(--bm)}
.pcd:active{transform:scale(.97)}
.pim{width:100%;aspect-ratio:1;background:var(--bei);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.pbg{position:absolute;top:6px;right:6px;background:var(--rd);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
.pbg.new{background:var(--gm)}
.pfv{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.pb{padding:8px 10px 10px}
.pn{font-size:12px;font-weight:700;color:var(--td);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pu{font-size:10px;color:var(--ts);margin-bottom:5px}
.ppr{display:flex;align-items:center;gap:5px}
.pp{font-size:14px;font-weight:900;color:var(--g)}
.pop{font-size:10px;text-decoration:line-through;color:var(--ts)}
.ab{width:26px;height:26px;border-radius:50%;background:var(--g);border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:auto;transition:var(--tr);flex-shrink:0}
.ab.ic{background:var(--go)}

/* ── PROMO PAGE ── */
.pbar{margin:12px 16px;background:var(--rd);color:#fff;border-radius:var(--r14);padding:14px 16px;display:flex;align-items:center;gap:10px}
.pts{display:flex;gap:8px;padding:0 16px;overflow-x:auto;margin-bottom:12px}
.pts::-webkit-scrollbar{display:none}
.ptc{flex-shrink:0;padding:6px 14px;border-radius:20px;background:var(--bei);border:1.5px solid var(--bm);font-size:11px;font-weight:600;color:var(--tm);cursor:pointer;font-family:inherit;transition:var(--tr)}
.ptc.active{background:var(--rd);color:#fff;border-color:var(--rd)}
.ftd{background:var(--td);color:#fff;border-radius:var(--r14);padding:10px 16px;margin:0 16px 12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.tdd{background:var(--rd);color:#fff;font-size:18px;font-weight:900;width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.tds{font-size:20px;font-weight:900;color:var(--go)}

/* ── LOYALTY ── */
.lh{background:var(--gd);color:#fff;margin:12px 16px;border-radius:var(--r22);padding:20px;text-align:center;position:relative;overflow:hidden}
.lh::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,.04);border-radius:50%}
.li{font-size:48px;margin-bottom:6px}
.ln{font-size:22px;font-weight:900;color:var(--go)}
.ld{font-size:14px;color:rgba(255,255,255,.8);margin-bottom:12px}
.pb2{background:rgba(255,255,255,.15);border-radius:20px;height:8px;margin:8px 0;overflow:hidden}
.pf{height:100%;background:var(--go);border-radius:20px;transition:width .6s ease}
.pl{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.6)}
.lsg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:16px}
.lsc{background:var(--wh);border-radius:var(--r14);padding:12px;text-align:center;box-shadow:var(--sh)}
.lsv{font-size:20px;font-weight:900;color:var(--g)}
.lsl{font-size:11px;color:var(--ts);margin-top:2px}
.tl{padding:0 16px 16px}
.tr2{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r14);margin-bottom:6px;background:var(--bei)}
.tr2.cur{background:var(--gp);border:1.5px solid var(--gm)}
.tri{font-size:22px;width:36px;text-align:center}
.trn{font-size:13px;font-weight:700;color:var(--td)}
.trr{font-size:11px;color:var(--ts)}
.trd{font-size:14px;font-weight:900;color:var(--g)}
.gp2{background:var(--gop);border:1.5px solid var(--go);border-radius:var(--r14);padding:14px;margin:0 16px 16px;display:flex;align-items:center;gap:12px}

/* ── CART ── */
.cw{padding:12px 16px 80px}
.ce{text-align:center;padding:60px 20px}
.cei{font-size:60px;margin-bottom:12px}
.cet{font-size:16px;font-weight:700;color:var(--tm);margin-bottom:4px}
.ces{font-size:13px;color:var(--ts)}
.ci{background:var(--wh);border-radius:var(--r14);border:1px solid var(--bm);padding:10px;display:flex;gap:10px;margin-bottom:8px;box-shadow:var(--sh)}
.cii{width:56px;height:56px;background:var(--bei);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.cib{flex:1}
.cin{font-size:13px;font-weight:700;color:var(--td)}
.ciu{font-size:10px;color:var(--ts)}
.cipr{display:flex;align-items:center;gap:8px;margin-top:6px}
.cip{font-size:14px;font-weight:900;color:var(--g)}
.qc{display:flex;align-items:center;gap:6px;margin-right:auto}
.qb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--g);background:var(--wh);color:var(--g);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.qb:hover{background:var(--g);color:#fff}
.qn{font-size:14px;font-weight:700;color:var(--td);min-width:20px;text-align:center}
.cprow{background:var(--bei);border-radius:var(--r14);padding:10px 12px;display:flex;gap:8px;margin-bottom:12px}
.cpi{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--td);outline:none}
.cpab{background:var(--gd);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.cpok{font-size:11px;color:var(--gm);font-weight:600;margin-top:4px}
.cs{background:var(--wh);border-radius:var(--r14);padding:14px;box-shadow:var(--sh);border:1px solid var(--bm)}
.sr{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--tm)}
.sr.tot{font-size:16px;font-weight:900;color:var(--td);border-top:1px solid var(--bm);margin-top:8px;padding-top:8px}
.sr.dis{color:var(--rd)}
.pi{background:var(--gop);border:1.5px solid var(--go);border-radius:var(--r14);padding:10px 14px;margin:10px 0;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--gd)}
.gn{background:var(--gp);border:1.5px solid var(--gm);border-radius:var(--r14);padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--gd);margin-bottom:8px}
.ckb{width:100%;background:var(--gd);color:#fff;border:none;border-radius:var(--r22);padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;transition:var(--tr);margin-top:12px}
.ckb:hover{background:var(--g)}
.ckb:disabled{background:var(--ts);cursor:not-allowed}

/* ── DELIVERY MODAL ── */
.mo{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.ms{background:var(--wh);border-radius:var(--r22) var(--r22) 0 0;padding:20px 16px 30px;max-height:85vh;overflow-y:auto}
.ms::-webkit-scrollbar{display:none}
.mh{width:40px;height:4px;background:var(--bm);border-radius:2px;margin:0 auto 16px}
.mt2{font-size:17px;font-weight:900;margin-bottom:16px;color:var(--td)}
.fg{margin-bottom:12px}
.fl{font-size:12px;font-weight:600;color:var(--tm);margin-bottom:4px}
.fi,.fs{width:100%;padding:10px 12px;border:1.5px solid var(--bm);border-radius:var(--r8);font-family:inherit;font-size:14px;color:var(--td);background:var(--wh);outline:none;transition:var(--tr)}
.fi:focus,.fs:focus{border-color:var(--gm)}
.dfd{background:var(--gp);border-radius:var(--r14);padding:10px 14px;font-size:13px;font-weight:700;color:var(--gd);display:flex;justify-content:space-between;margin-bottom:12px}
.cfb{width:100%;background:var(--g);color:#fff;border:none;border-radius:var(--r22);padding:13px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}

/* ── ACCOUNT ── */
.ach{background:var(--gd);color:#fff;padding:20px 16px 30px;text-align:center;margin-bottom:-16px}
.aca{width:72px;height:72px;border-radius:50%;background:var(--go);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--gd)}
.acn{font-size:17px;font-weight:900}
.acp{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.atb{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:#fff;margin-top:8px}
.acb{padding:0 16px 80px}
.aca2{background:var(--wh);border-radius:var(--r14);box-shadow:var(--sh);overflow:hidden;margin-bottom:10px;margin-top:16px}
.ar{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--bei);cursor:pointer;transition:var(--tr)}
.ar:last-child{border-bottom:none}
.ar:hover{background:var(--bei)}
.ari{font-size:20px;width:32px;text-align:center}
.arl{flex:1;font-size:14px;font-weight:600;color:var(--td)}
.arc{font-size:12px;color:var(--ts)}
.ar.dng .arl{color:var(--rd)}
.ls{display:flex;gap:6px;padding:8px 14px}
.lo{flex:1;padding:8px;border:1.5px solid var(--bm);border-radius:var(--r8);text-align:center;font-size:12px;font-weight:700;cursor:pointer;transition:var(--tr);font-family:inherit;background:var(--wh);color:var(--tm)}
.lo.active{background:var(--g);color:#fff;border-color:var(--g)}

/* ── PRODUCT DETAIL ── */
.pdb{padding:16px}
.pdn{font-size:18px;font-weight:900;color:var(--td);margin-bottom:4px}
.pdu{font-size:12px;color:var(--ts);margin-bottom:10px}
.pdpr{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pdp{font-size:22px;font-weight:900;color:var(--g)}
.pdop{font-size:14px;text-decoration:line-through;color:var(--ts)}
.pdsec{font-size:13px;font-weight:700;color:var(--tm);margin-bottom:6px}
.pdd{font-size:13px;color:var(--tm);line-height:1.6;margin-bottom:14px}
.pdbf{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.bfit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tm)}
.pdft{padding:16px;background:var(--wh);border-top:1px solid var(--bm);display:flex;align-items:center;gap:12px}
.pdqc{display:flex;align-items:center;gap:10px;background:var(--bei);border-radius:var(--r22);padding:6px 12px}
.pdab{flex:1;background:var(--gd);color:#fff;border:none;border-radius:var(--r22);padding:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit}

/* ── NOTIFICATIONS ── */
.nit{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bei)}
.nit.unr{background:var(--gp)}
.nii{width:38px;height:38px;border-radius:50%;background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.nib2{flex:1}
.nitt{font-size:13px;font-weight:700;color:var(--td)}
.nitx{font-size:12px;color:var(--ts);margin-top:2px}
.nttm{font-size:10px;color:var(--ts);margin-top:4px}

/* ── AI CHAT ── */
.cwr{display:flex;flex-direction:column;height:100%}
.cmsg{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.cmsg::-webkit-scrollbar{display:none}
.cbub{max-width:85%;padding:10px 14px;border-radius:var(--r14);font-size:13px;line-height:1.5}
.cbub.bot{background:var(--bei);align-self:flex-start;border-radius:4px var(--r14) var(--r14) var(--r14)}
.cbub.usr{background:var(--g);color:#fff;align-self:flex-end;border-radius:var(--r14) 4px var(--r14) var(--r14)}
.csgs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.csg{background:var(--bei);border:1.5px solid var(--bm);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;color:var(--td);font-family:inherit}
.csg:hover{background:var(--gp);border-color:var(--gm);color:var(--gd)}
.cib2{padding:10px 16px;background:var(--wh);border-top:1px solid var(--bm);display:flex;gap:8px;flex-shrink:0}
.cin2{flex:1;padding:10px 14px;border:1.5px solid var(--bm);border-radius:var(--r22);font-family:inherit;font-size:13px;outline:none;color:var(--td);background:var(--bei)}
.cin2:focus{border-color:var(--gm)}
.csd{background:var(--g);border:none;border-radius:50%;width:38px;height:38px;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.aab{background:var(--gd);color:#fff;border:none;border-radius:var(--r14);padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;width:100%}

/* ── AUTH ── */
.aus{height:100%;display:flex;flex-direction:column;background:var(--wh)}
.auh{background:var(--gd);padding:50px 24px 40px;text-align:center;flex-shrink:0}
.aulo{font-size:42px;font-weight:900;color:var(--go);font-family:'Cairo',sans-serif}
.ause{font-size:13px;color:rgba(255,255,255,.7);margin-top:6px}
.auf{flex:1;padding:24px 20px;overflow-y:auto}
.autt{font-size:18px;font-weight:900;color:var(--td);margin-bottom:4px}
.ausb{font-size:13px;color:var(--ts);margin-bottom:20px}
.auinp{width:100%;padding:12px 14px;border:1.5px solid var(--bm);border-radius:var(--r14);font-family:inherit;font-size:14px;outline:none;color:var(--td);background:var(--wh);margin-bottom:10px;transition:var(--tr)}
.auinp:focus{border-color:var(--gm)}
.aubt{width:100%;background:var(--gd);color:#fff;border:none;border-radius:var(--r22);padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;transition:var(--tr);margin-top:4px}
.aubt:hover{background:var(--g)}
.ausw{text-align:center;font-size:13px;color:var(--ts);margin-top:14px}
.ausw span{color:var(--g);font-weight:700;cursor:pointer}
.dmb{width:100%;background:var(--bei);color:var(--gd);border:1.5px solid var(--bm);border-radius:var(--r22);padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}

/* ── ORDER SUCCESS ── */
.osc{text-align:center;padding:40px 24px 80px}
.osi{font-size:70px;margin-bottom:16px}
.ost{font-size:20px;font-weight:900;color:var(--gd);margin-bottom:6px}

function sendAI(msg){
  if(!msg||!msg.trim())return;
  S.msgs.push({r:'usr',t:msg});
  const lo=msg.toLowerCase();
  let resp=AI.default;
  if(lo.includes('كسكسي')||lo.includes('couscous'))resp=AI.couscous;
  else if(lo.includes('طاجين')||lo.includes('tagine'))resp=AI.tagine;
  else if(lo.includes('هريسة')||lo.includes('harissa'))resp=AI.harissa;
  else if(lo.includes('ولاء')||lo.includes('fidélité')||lo.includes('loyalty'))resp=AI.loyalty;
  S.msgs.push({r:'bot',t:'...',typing:true});
  render();
  setTimeout(()=>{
    S.msgs.pop();
    S.msgs.push({r:'bot',t:resp[S.lang]||resp.ar,prods:resp.prods||[]});
    render();
  },800);
}

function showToast(msg, icon='✅'){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--gd);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:700;font-family:Cairo,sans-serif;z-index:999;opacity:0;transition:all .3s;white-space:nowrap';document.getElementById('root').appendChild(t);}
  t.textContent=`${icon} ${msg}`;
  t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(t._to);
  t._to=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';},2200);
}

let timerInt=null;

  if(timerInt)return;
  timerInt=setInterval(()=>{
    S.timerSecs=Math.max(0,S.timerSecs-1);

    if(h)h.textContent=p(Math.floor(S.timerSecs/3600));

}

// ── LOAD PRODUCTS ──
async function loadProducts() {
  if (!db) return;
  try {
    const { data } = await db.from('products').select('*, categories(name_ar,name_fr,slug)').eq('is_active', true);
    if (data && data.length > 0) {
      // Map Supabase products to app format
      data.forEach(p => {
        const existing = PRODS.find(x => x.id === p.id);
        if (!existing) {
          PRODS.push({
            id: p.id, cat: p.categories?.slug || 'spices',
            e: p.images?.[0] || '📦',
            ar: p.name_ar, fr: p.name_fr, en: p.name_en || p.name_fr,
            u: p.unit, p: parseFloat(p.price),
            pp: p.promo_price ? parseFloat(p.promo_price) : null,
            s: p.stock_qty || 0, new: p.is_new, feat: p.is_featured,
            dar: p.description_ar || '', dfr: p.description_fr || '',
            ben: p.benefits_ar ? p.benefits_ar.split('\n') : []
          });
        }
      });
    }
  } catch(e) { console.log('Using demo products'); }
}

// ── LOAD CART from Supabase ──
async function loadCart() {
  if (!db || !S.user?.id) return;
  try {
    const { data } = await db.from('cart_items').select('product_id, quantity').eq('user_id', S.user.id);
    if (data) { S.cart = {}; data.forEach(item => { S.cart[item.product_id] = item.quantity; }); }
  } catch(e) { console.log('Using local cart'); }
}

// ── LOAD DELIVERY ZONES ──
async function loadZones() {
  if (!db) return;
  try {
    const { data } = await db.from('delivery_zones').select('*').eq('is_active', true);
    if (data && data.length > 0) {
      ZONES.length = 0;
      data.forEach(z => ZONES.push({ id: z.id, gov: z.governorate, city: z.city, area: z.area || '', price: parseFloat(z.price) }));
    }
  } catch(e) { console.log('Using demo zones'); }
}

// ── SYNC CART to Supabase ──
async function syncCart(productId, quantity) {
  if (!db || !S.user?.id) return;
  try {
    await db.rpc('upsert_cart_item', { p_user_id: S.user.id, p_product_id: productId, p_quantity: quantity });
  } catch(e) { console.log('Cart sync failed, using local'); }
}

// ── OVERRIDE addCart & rmCart to sync ──
const _addCart = addCart;
const _rmCart  = rmCart;
window.addCart = function(id) {
  S.cart[id] = (S.cart[id] || 0) + 1;
  syncCart(id, S.cart[id]);
  render();
};
window.rmCart = function(id) {
  if (S.cart[id] > 1) S.cart[id]--;
  else delete S.cart[id];
  syncCart(id, S.cart[id] || 0);
  render();
};

        email, password: S.authF.pass,
        options: { data: { full_name: S.authF.name, phone: S.authF.phone } }
      });
      if (error) { showToast(error.message, '⚠️'); return; }
      showToast(L('تم إنشاء الحساب!','Compte créé!','Account created!'));
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password: S.authF.pass });
      if (error) { showToast(L('بيانات خاطئة','Identifiants incorrects','Wrong credentials'), '⚠️'); return; }
    }
  } catch(e) {
    S.user = { name: S.authF.name || 'مستخدم', phone: S.authF.phone }; render();
  }
}

async function demoLogin() {
  if (!db) { S.user = { name: L('أحمد بن علي','Ahmed Ben Ali','Ahmed Ben Ali'), phone: '55 123 456' }; render(); return; }
  try {
    const { data, error } = await db.auth.signInWithPassword({ email: 'demo@nakhat.tn', password: 'Demo123456!' });
    if (error) {
      // Create demo user if not exists
      await db.auth.signUp({ email: 'demo@nakhat.tn', password: 'Demo123456!', options: { data: { full_name: 'Ahmed Ben Ali', phone: '55 123 456' } } });
      await db.auth.signInWithPassword({ email: 'demo@nakhat.tn', password: 'Demo123456!' });
    }
  } catch(e) {
    S.user = { name: L('أحمد بن علي','Ahmed Ben Ali','Ahmed Ben Ali'), phone: '55 123 456' }; render();
  }
}

// ── OVERRIDE logout ──
const origLogout = window.render;
function logout() { if (db) db.auth.signOut(); S.user = null; S.cart = {}; render(); }

// ── OVERRIDE placeOrder to use Supabase checkout function ──
async function placeOrder() {
  if (!S.df.phone) { showToast(L('أدخل رقم هاتفك','Entrez votre numéro','Enter your phone'), '⚠️'); return; }
  const sub = cartSub(), itemIds = Object.keys(S.cart);

  if (db && S.user?.id) {
    try {
      const { data, error } = await db.rpc('checkout', {
        p_user_id:     S.user.id,
        p_governorate: S.df.gov,
        p_city:        S.df.city,
        p_area:        S.df.area || '',
        p_street:      S.df.street || '',
        p_house:       S.df.house || '',
        p_phone:       S.df.phone,
        p_coupon_code: S.coupon || null
      });
      if (error) { showToast(error.message, '⚠️'); return; }
      const orderNum = 'ND-' + Date.now().toString().slice(-6);
      S.lastOrder = { id: orderNum, num: orderNum, total: sub, hasGift: sub >= 200, date: new Date().toISOString(), items: itemIds };
      S.orderHistory.unshift(S.lastOrder);
      S.demoSpend += sub; S.modal = null; S.orderDone = true; S.cart = {};
      render(); return;
    } catch(e) { console.log('Using local checkout'); }
  }

  // Fallback local
  const orderNum = 'ND-' + Date.now().toString().slice(-6);
  S.lastOrder = { id: orderNum, num: orderNum, total: sub, hasGift: sub >= 200, date: new Date().toISOString(), items: itemIds };
  S.orderHistory.unshift(S.lastOrder);
  S.demoSpend += sub; S.modal = null; S.orderDone = true; S.cart = {};
  render();
}

// ── INIT ──
if (typeof supabase !== 'undefined') {
  initSupabase();
} else {
  render();
}
</script>
