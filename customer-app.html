<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a4731">
<meta name="mobile-web-app-capable" content="yes">
<!-- Cache version - change this number to force update -->
<meta name="app-version" content="2.1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نكهة الدار">
<link rel="manifest" href="/manifest.json">
<title>نكهة الدار</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gd:#1a4731;--g:#2d6a4f;--gm:#40916c;--gl:#74c69d;--gp:#d8f3dc;
  --go:#f0b429;--gop:#fef9e7;--bei:#f5f0e8;--bm:#ede4d0;
  --wh:#fff;--td:#1a1a2e;--tm:#4a4a5a;--ts:#8a8a9a;--rd:#e63946;
  --r8:8px;--r14:14px;--r22:22px;
  --sh:0 1px 6px rgba(0,0,0,.07);--shm:0 4px 16px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Cairo',sans-serif}
body{background:var(--bei);color:var(--td);direction:rtl}
#root{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:var(--wh);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.15)}

/* AUTH */
.auth{position:absolute;inset:0;z-index:100;background:var(--wh);display:flex;flex-direction:column;overflow-y:auto}
.auth-hero{background:var(--gd);padding:50px 24px 40px;text-align:center;flex-shrink:0}
.auth-lang{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.auth-lang button{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.auth-logo{margin-bottom:8px}
.auth-logo img{width:120px;height:120px;border-radius:20px}
.auth-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px}
.auth-form{flex:1;padding:24px 20px 40px}
.auth-title{font-size:18px;font-weight:900;color:var(--td);margin-bottom:4px}
.auth-sub2{font-size:13px;color:var(--ts);margin-bottom:20px}
.auth-inp{width:100%;padding:12px 14px;border:1.5px solid var(--bm);border-radius:var(--r14);font-family:inherit;font-size:14px;outline:none;color:var(--td);background:var(--wh);margin-bottom:10px;transition:.2s}
.auth-inp:focus{border-color:var(--gm)}
.auth-btn{width:100%;background:var(--gd);color:#fff;border:none;border-radius:var(--r22);padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:4px}
/* auth-demo removed */
.auth-switch{text-align:center;font-size:13px;color:var(--ts);margin-top:14px}
.auth-switch span{color:var(--g);font-weight:700;cursor:pointer}
.phone-wrap{position:relative;margin-bottom:10px}
.phone-prefix{position:absolute;top:50%;transform:translateY(-50%);right:14px;font-size:13px;font-weight:700;color:var(--tm);pointer-events:none;z-index:1}
.phone-inp{width:100%;padding:12px 55px 12px 14px;border:1.5px solid var(--bm);border-radius:var(--r14);font-family:inherit;font-size:14px;outline:none;color:var(--td);background:var(--wh);transition:.2s}
.phone-inp:focus{border-color:var(--gm)}

/* HEADER */
.hd{background:var(--gd);color:#fff;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hd-logo{display:flex;align-items:center;gap:8px;cursor:pointer}
.hd-mark{width:40px;height:40px;border-radius:10px;overflow:hidden;flex-shrink:0}
.hd-mark img{width:100%;height:100%;object-fit:cover}
.hd-title{font-size:17px;font-weight:900}
.hd-sub{font-size:9px;color:var(--gl);letter-spacing:.8px}
.hd-actions{display:flex;align-items:center;gap:6px}
.hd-btn{background:rgba(255,255,255,.12);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:17px}
.hd-btn.back{background:rgba(255,255,255,.15);font-size:13px;font-weight:700;border-radius:20px;width:auto;padding:0 12px;gap:4px}
.cart-badge{position:relative}
.cart-cnt{position:absolute;top:-5px;left:-5px;background:var(--go);color:var(--gd);font-size:9px;font-weight:900;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* SCROLL */
.ps{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.ps::-webkit-scrollbar{display:none}

/* BOTTOM NAV */
.bn{display:flex;background:var(--wh);border-top:1px solid var(--bm);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);position:sticky;bottom:0;z-index:50}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;cursor:pointer;border:none;background:none;color:var(--ts);font-family:inherit;gap:3px;position:relative}
.ni.active{color:var(--g)}
.ni-ic{font-size:20px;line-height:1}
.ni-lb{font-size:9px;font-weight:600}
.ni-bd{position:absolute;top:6px;right:calc(50% - 16px);background:var(--rd);color:#fff;font-size:8px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* REFERRAL TOP BAR */
.ref-topbar{background:linear-gradient(90deg,var(--go),#e6a817);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;cursor:pointer;position:relative;overflow:hidden}
.ref-topbar::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(255,255,255,.06) 10px,rgba(255,255,255,.06) 20px)}
.ref-topbar-txt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--gd);position:relative;z-index:1}
.ref-topbar-code{background:var(--gd);color:var(--go);font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;letter-spacing:1px}
.ref-topbar-close{background:none;border:none;color:var(--gd);font-size:14px;cursor:pointer;opacity:.5;position:relative;z-index:1;padding:4px}
.ref-topbar-close:hover{opacity:1}

/* REFERRAL BANNER (carousel) */
.ref-bnr{background:linear-gradient(135deg,#1a4731 0%,#2d6a4f 50%,#1e5a3a 100%)!important;position:relative}
.ref-bnr .bnr-badge,.ref-bnr .bnr-title,.ref-bnr .bnr-sub,.ref-bnr>div:last-child{position:relative;z-index:1}
.ref-bnr-bg{position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.ref-bnr-code{background:rgba(240,180,41,.2);border:2px dashed rgba(240,180,41,.5);border-radius:12px;padding:8px 16px;text-align:center;font-size:20px;font-weight:900;letter-spacing:3px;color:var(--go);margin-top:8px;position:relative;z-index:1}

/* REFERRAL */
.ref-card{background:linear-gradient(135deg,var(--gd),#1e5a3a);border-radius:var(--r22);padding:20px;margin:12px 16px;color:#fff;position:relative;overflow:hidden}
.ref-card::after{content:'🎁';position:absolute;top:-10px;left:-10px;font-size:80px;opacity:.08}
.ref-code-box{background:rgba(255,255,255,.15);border:2px dashed rgba(255,255,255,.4);border-radius:var(--r14);padding:12px;text-align:center;margin:12px 0}
.ref-code{font-size:24px;font-weight:900;letter-spacing:3px;color:var(--go)}
.ref-share-btn{background:var(--go);color:var(--gd);border:none;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;margin:0 auto}
.ref-stats{display:flex;gap:12px;margin-top:14px}
.ref-stat{flex:1;background:rgba(255,255,255,.1);border-radius:var(--r14);padding:10px;text-align:center}
.ref-stat-v{font-size:18px;font-weight:900;color:var(--go)}
.ref-stat-l{font-size:10px;opacity:.7;margin-top:2px}
.ref-input-wrap{padding:12px 16px}
.ref-input-row{display:flex;gap:8px}
.ref-input{flex:1;padding:10px 14px;border:1.5px solid var(--bm);border-radius:var(--r14);font-family:inherit;font-size:14px;outline:none;text-transform:uppercase;letter-spacing:1px}
.ref-input:focus{border-color:var(--gm)}
.ref-apply-btn{background:var(--gd);color:#fff;border:none;border-radius:var(--r14);padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.ref-credit-badge{background:var(--gop);border:1.5px solid var(--go);border-radius:var(--r14);padding:10px 14px;margin:8px 16px;display:flex;align-items:center;justify-content:space-between}
.ref-history{padding:0 16px 16px}
.ref-h-item{background:var(--wh);border-radius:var(--r14);padding:10px 14px;margin-bottom:8px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px}

/* SEARCH */
.srch{padding:12px 16px;background:var(--bei);border-bottom:1px solid var(--bm)}
.srch-inner{background:var(--wh);border-radius:var(--r22);display:flex;align-items:center;gap:8px;padding:10px 14px;box-shadow:var(--sh)}
.srch-inner input{flex:1;border:none;outline:none;font-family:inherit;font-size:14px;background:transparent;color:var(--td)}

/* BANNER */
.bsc{display:flex;gap:12px;overflow-x:auto;padding:12px 16px 0;scroll-snap-type:x mandatory}
.bsc::-webkit-scrollbar{display:none}
.bnr{min-width:90%;background:var(--gd);border-radius:var(--r22);padding:20px;scroll-snap-align:start;position:relative;overflow:hidden;flex-shrink:0}
.bnr.gold{background:linear-gradient(135deg,var(--go),#9b7309)}
.bnr-badge{background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:8px}
.bnr-title{font-size:18px;font-weight:900;color:#fff;margin-bottom:4px}
.bnr-sub{font-size:12px;color:rgba(255,255,255,.8)}
.bnr-btn{margin-top:12px;background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:20px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer;display:inline-block;font-family:inherit}

/* CATEGORIES */
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;padding:8px 10px;border-radius:var(--r14);background:var(--bei);border:1.5px solid transparent;min-width:64px}
.cat.active{background:var(--gp);border-color:var(--gm)}
.cat-ic{font-size:22px}
.cat-nm{font-size:10px;font-weight:600;color:var(--tm);white-space:nowrap}
.cat.active .cat-nm{color:var(--g)}

/* SECTION */
.sec{padding:16px 16px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-t{font-size:15px;font-weight:700}
.sec-a{font-size:12px;color:var(--gm);font-weight:600;cursor:pointer;border:none;background:none;font-family:inherit}

/* PRODUCT CARD */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.psc{display:flex;gap:10px;overflow-x:auto;padding:0 16px 16px}
.psc::-webkit-scrollbar{display:none}
.psc .pc{min-width:140px;max-width:160px;flex-shrink:0}
.pc{background:var(--wh);border-radius:var(--r14);box-shadow:var(--sh);overflow:hidden;cursor:pointer;border:1px solid var(--bm)}
.pc:active{transform:scale(.97)}
.pc-img{width:100%;aspect-ratio:1;background:var(--bei);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden}
.pc-disc{position:absolute;top:6px;right:6px;background:var(--rd);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
.pc-new{position:absolute;top:6px;right:6px;background:var(--gm);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
.pc-fav{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.9);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.pc-body{padding:8px 10px 10px}
.pc-name{font-size:12px;font-weight:700;color:var(--td);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-unit{font-size:10px;color:var(--ts);margin-bottom:5px}
.pc-row{display:flex;align-items:center;gap:5px}
.pc-price{font-size:14px;font-weight:900;color:var(--g)}
.pc-old{font-size:10px;text-decoration:line-through;color:var(--ts)}
.add-btn{width:26px;height:26px;border-radius:50%;background:var(--g);border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-right:auto;flex-shrink:0}
.add-btn.in{background:var(--go)}

/* PROMOS */
.promo-types{display:flex;gap:8px;padding:0 16px;overflow-x:auto;margin:12px 0}
.promo-types::-webkit-scrollbar{display:none}
.pt{flex-shrink:0;padding:6px 14px;border-radius:20px;background:var(--bei);border:1.5px solid var(--bm);font-size:11px;font-weight:600;color:var(--tm);cursor:pointer;font-family:inherit}
.pt.active{background:var(--rd);color:#fff;border-color:var(--rd)}
.flash-timer{background:var(--td);color:#fff;border-radius:var(--r14);padding:10px 16px;margin:0 16px 12px;display:flex;align-items:center;gap:10px}
.td-box{background:var(--rd);color:#fff;font-size:18px;font-weight:900;width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.td-sep{font-size:20px;font-weight:900;color:var(--go)}

/* LOYALTY */
.loy-hero{background:var(--gd);color:#fff;margin:12px 16px;border-radius:var(--r22);padding:20px;text-align:center;position:relative;overflow:hidden}
.loy-icon{font-size:48px;margin-bottom:6px}
.loy-name{font-size:22px;font-weight:900;color:var(--go)}
.loy-pbar{background:rgba(255,255,255,.15);border-radius:20px;height:8px;margin:8px 0;overflow:hidden}
.loy-pfill{height:100%;background:var(--go);border-radius:20px;transition:width .6s}
.loy-plbl{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.6)}
.loy-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:16px}
.loy-stat{background:var(--wh);border-radius:var(--r14);padding:12px;text-align:center;box-shadow:var(--sh)}
.loy-stat-v{font-size:20px;font-weight:900;color:var(--g)}
.loy-stat-l{font-size:11px;color:var(--ts);margin-top:2px}
.gift-box{background:var(--gop);border:1.5px solid var(--go);border-radius:var(--r14);padding:14px;margin:0 16px 16px;display:flex;align-items:center;gap:12px}
.tiers-list{padding:0 16px 16px}
.tier-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r14);margin-bottom:6px;background:var(--bei)}
.tier-row.cur{background:var(--gp);border:1.5px solid var(--gm)}

/* CART */
.cart-wrap{padding:12px 16px 80px}
.cart-empty{text-align:center;padding:60px 20px}
.ci{background:var(--wh);border-radius:var(--r14);border:1px solid var(--bm);padding:10px;display:flex;gap:10px;margin-bottom:8px;box-shadow:var(--sh)}
.ci-img{width:56px;height:56px;background:var(--bei);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.ci-body{flex:1}
.ci-name{font-size:13px;font-weight:700}
.ci-unit{font-size:10px;color:var(--ts)}
.ci-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.ci-price{font-size:14px;font-weight:900;color:var(--g)}
.qc{display:flex;align-items:center;gap:6px;margin-right:auto}
.qb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--g);background:var(--wh);color:var(--g);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.qn{font-size:14px;font-weight:700;min-width:20px;text-align:center}
.coupon-row{background:var(--bei);border-radius:var(--r14);padding:10px 12px;display:flex;gap:8px;margin-bottom:10px}
.coupon-inp{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;outline:none}
.coupon-btn{background:var(--gd);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.summary{background:var(--wh);border-radius:var(--r14);padding:14px;box-shadow:var(--sh);border:1px solid var(--bm)}
.s-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--tm)}
.s-row.total{font-size:16px;font-weight:900;color:var(--td);border-top:1px solid var(--bm);margin-top:8px;padding-top:8px}
.s-row.disc{color:var(--rd)}
.cod-badge{background:var(--gop);border:1.5px solid var(--go);border-radius:var(--r14);padding:10px 14px;margin:10px 0;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--gd)}
.gift-notice{background:var(--gp);border:1.5px solid var(--gm);border-radius:var(--r14);padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--gd);margin-bottom:8px}
.ck-btn{width:100%;background:var(--gd);color:#fff;border:none;border-radius:var(--r22);padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;margin-top:12px}

/* DELIVERY MODAL */
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;flex-direction:column;justify-content:flex-end}
.modal-sheet{background:var(--wh);border-radius:var(--r22) var(--r22) 0 0;padding:20px 16px 30px;max-height:85vh;overflow-y:auto}
.modal-sheet::-webkit-scrollbar{display:none}
.modal-handle{width:40px;height:4px;background:var(--bm);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:900;margin-bottom:16px}
.fg{margin-bottom:12px}
.fl{font-size:12px;font-weight:600;color:var(--tm);margin-bottom:4px}
.fi,.fs{width:100%;padding:10px 12px;border:1.5px solid var(--bm);border-radius:var(--r8);font-family:inherit;font-size:14px;color:var(--td);background:var(--wh);outline:none}
.fi:focus,.fs:focus{border-color:var(--gm)}
.confirm-btn{width:100%;background:var(--g);color:#fff;border:none;border-radius:var(--r22);padding:13px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}

/* ACCOUNT */
.acc-hero{background:var(--gd);color:#fff;padding:20px 16px 30px;text-align:center;margin-bottom:-16px}
.acc-av{width:72px;height:72px;border-radius:50%;background:var(--go);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--gd)}
.acc-name{font-size:17px;font-weight:900}
.acc-phone{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.acc-tier{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;margin-top:8px}
.acc-body{padding:0 16px 80px}
.acc-card{background:var(--wh);border-radius:var(--r14);box-shadow:var(--sh);overflow:hidden;margin-bottom:10px;margin-top:16px}
.acc-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--bei);cursor:pointer}
.acc-row:last-child{border-bottom:none}
.acc-row:hover{background:var(--bei)}
.acc-row.danger .acc-label{color:var(--rd)}
.acc-icon{font-size:20px;width:32px;text-align:center}
.acc-label{flex:1;font-size:14px;font-weight:600}
.lang-sel{display:flex;gap:6px;padding:8px 14px}
.lang-opt{flex:1;padding:8px;border:1.5px solid var(--bm);border-radius:var(--r8);text-align:center;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--wh);color:var(--tm)}
.lang-opt.active{background:var(--g);color:#fff;border-color:var(--g)}

/* PRODUCT DETAIL */
.pd-img{width:100%;max-height:300px;aspect-ratio:1.1;background:var(--bei);display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden}

.pd-name{font-size:18px;font-weight:900;margin-bottom:4px}
.pd-unit{font-size:12px;color:var(--ts);margin-bottom:10px}
.pd-price-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pd-price{font-size:22px;font-weight:900;color:var(--g)}
.pd-old{font-size:14px;text-decoration:line-through;color:var(--ts)}
.pd-sec{font-size:13px;font-weight:700;color:var(--tm);margin-bottom:6px}
.pd-desc{font-size:13px;color:var(--tm);line-height:1.6;margin-bottom:14px}
.pd-footer{position:sticky;bottom:0;padding:14px 16px;background:var(--wh);border-top:1px solid var(--bm);display:flex;align-items:center;gap:12px}
.pd-qty{display:flex;align-items:center;gap:10px;background:var(--bei);border-radius:var(--r22);padding:6px 12px}
.pd-add{flex:1;background:var(--gd);color:#fff;border:none;border-radius:var(--r22);padding:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit}

/* AI CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.chat-msgs::-webkit-scrollbar{display:none}
.bubble{max-width:85%;padding:10px 14px;border-radius:var(--r14);font-size:13px;line-height:1.5;white-space:pre-line}
.bubble.bot{background:var(--bei);align-self:flex-start;border-radius:4px var(--r14) var(--r14) var(--r14)}
.bubble.usr{background:var(--g);color:#fff;align-self:flex-end;border-radius:var(--r14) 4px var(--r14) var(--r14)}
.chat-sugs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.sug-btn{background:var(--bei);border:1.5px solid var(--bm);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.chat-bar{padding:10px 16px;background:var(--wh);border-top:1px solid var(--bm);display:flex;gap:8px;flex-shrink:0}
.chat-inp{flex:1;padding:10px 14px;border:1.5px solid var(--bm);border-radius:var(--r22);font-family:inherit;font-size:13px;outline:none;background:var(--bei)}
.chat-send{background:var(--g);border:none;border-radius:50%;width:38px;height:38px;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.add-all-btn{background:var(--gd);color:#fff;border:none;border-radius:var(--r14);padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;width:100%}

/* NOTIFICATIONS */
.notif-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bei)}
.notif-item.unread{background:var(--gp)}
.notif-icon{width:38px;height:38px;border-radius:50%;background:var(--gp);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* ORDER SUCCESS */
.success-wrap{text-align:center;padding:40px 24px 80px}
.success-icon{font-size:70px;margin-bottom:16px}
.success-title{font-size:20px;font-weight:900;color:var(--gd);margin-bottom:6px}
.order-num{background:var(--gp);border-radius:var(--r14);padding:10px 20px;font-size:16px;font-weight:900;color:var(--gd);display:inline-block;margin-bottom:16px}

/* SUBPAGE HEADER */

.sub-title{font-size:16px;font-weight:900}
.back-btn{background:var(--bei);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}

.pwa-bar-txt div:last-child{font-size:10px;opacity:.7}
.pwa-bar-btn{background:var(--go);color:var(--gd);border:none;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;flex-shrink:0}
.pwa-bar-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;flex-shrink:0;padding:4px}

.onb-slides{flex:1;position:relative;overflow:hidden}

.onb-slide .onb-desc{font-size:14px;color:rgba(255,255,255,.8);line-height:1.7}
.onb-dots{display:flex;justify-content:center;gap:8px;padding:16px}

.onb-footer{padding:16px 30px 40px;display:flex;gap:12px}

/* ═══════ TOAST ═══════ */
function toast(msg,icon='✅'){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=`${icon} ${msg}`;
  t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(t._to);
  t._to=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';},2500);
}

async function shareReferral(){
  const code=S.referralCode;
  if(!code){toast(L('لا يوجد رمز','Pas de code','No code'),'⚠️');return;}
  const msg=T('referralinvite')+'\n'+L(
    'استخدم رمزي: ','Utilise mon code : ','Use my code: ')+code+'\n'+'https://nakhatdar.vercel.app/customer-app.html?ref='+code;
  if(navigator.share){
    try{await navigator.share({title:'نكهة الدار',text:msg});return;}catch(e){}
  }
  try{await navigator.clipboard.writeText(msg);toast(L('تم النسخ!','Copié!','Copied!'));}catch(e){
    toast(L('رمزك: ','Votre code: ','Your code: ')+code);
  }
}

async function applyReferralCode(){
  const code=S.referralInput.trim();
  if(!code||code.length<5){toast(L('أدخل رمزاً صحيحاً','Entrez un code valide','Enter a valid code'),'⚠️');return;}
  if(code===S.referralCode){toast(L('لا يمكنك استخدام رمزك!','Vous ne pouvez pas utiliser votre propre code!','You can\'t use your own code!'),'⚠️');return;}
  if(!db||!S.user?.id){toast(L('سجّل دخولك أولاً','Connectez-vous d\'abord','Sign in first'),'⚠️');return;}

  toast(L('جاري التحقق...','Vérification...','Checking...'),'⏳');
  try{
    const{data,error}=await db.rpc('apply_referral_code',{p_referee_id:S.user.id,p_referral_code:code});
    if(error)throw error;
    if(data?.success){
      S.referredBy=data.sponsor_id;
      S.referralInput='';
      toast(L('🎉 رمز مقبول! ستحصل على 5 دت خصم في أول طلب','🎉 Code accepté! 5 DT de réduction sur votre 1ère commande','🎉 Code accepted! 5 DT off your 1st order'));
      render();
    }else{
      toast(data?.message||L('رمز غير صالح','Code invalide','Invalid code'),'⚠️');
    }
  }catch(e){console.log('Referral error:',e);toast(L('خطأ','Erreur','Error'),'⚠️');}
}

async function loadReferralData(){
  if(!db||!S.user?.id)return;
  try{
    // Load profile referral data
    const{data:profile}=await db.from('profiles')
      .select('referral_code,referral_credit,referral_credit_expires,referred_by')
      .eq('id',S.user.id).single();
    if(profile){
      S.referralCode=profile.referral_code||'';
      S.referralCredit=parseFloat(profile.referral_credit||0);
      S.referralCreditExpires=profile.referral_credit_expires;
      S.referredBy=profile.referred_by;
    }
    // Load my referrals (as sponsor)
    const{data:refs}=await db.from('referrals')
      .select('*')
      .eq('sponsor_id',S.user.id)
      .order('created_at',{ascending:false});
    if(refs)S.myReferrals=refs;
    // Check if I have a pending referral (as referee — for 5 DT discount)
    if(S.referredBy){
      const{data:myRef}=await db.from('referrals')
        .select('status')
        .eq('referee_id',S.user.id)
        .eq('status','pending')
        .limit(1);
      S.hasPendingReferee=myRef&&myRef.length>0;
    }
  }catch(e){console.log('Load referral error:',e);}
}

          <div class="qc">

            <span class="qn">${S.cart[p.id]}</span>
            <button class="qb" onclick="addCart('${p.id}')">+</button>
          </div>

    ${S.couponApplied?`<div style="font-size:11px;color:var(--gm);font-weight:600;margin-bottom:8px">✅ ${L('كوبون مطبّق!','Coupon appliqué!','Coupon applied!')} −${S.couponApplied.disc}%</div>`:''}
    <div class="summary">
      <div class="s-row"><span>${T('subtotal')}</span><span>${fp(sub)}</span></div>
      ${disc>0?`<div class="s-row disc"><span>${T('rewardsdisc')} (−${disc}%)</span><span>−${fp(ldAmt)}</span></div>`:''}
      ${cAmt?`<div class="s-row disc"><span>${T('coupondisc')}</span><span>−${fp(cAmt)}</span></div>`:''}
      ${refDisc>0?`<div class="s-row disc"><span>🤝 ${T('referraldiscref')}</span><span>−${fp(refDisc)}</span></div>`:''}

/* ── ORDERS ── */
async function loadMyOrders(){
  if(!db||!S.user?.id)return;
  try{
    const{data}=await db
      .from('orders')
      .select('*, order_items(name_ar, name_fr, unit_price, quantity, subtotal)')
      .eq('user_id',S.user.id)
      .order('created_at',{ascending:false});
    if(data){
      S.orderHistory=data.map(o=>({
        id:o.id, num:o.order_number, total:parseFloat(o.total),
        hasGift:o.has_gift, date:o.created_at,
        status:o.status,
        items:o.order_items||[],
        zone:`${o.city||''}${o.area?' - '+o.area:''}`,
        phone:o.customer_phone
      }));
    }
  }catch(e){console.log('Orders load error:',e);}
}

  const ps=document.getElementById('ps');

async function sendResetEmail(){
  const email=S.authF.email?.trim();
  if(!email||!email.includes('@')){
    toast(L('أدخل بريداً إلكترونياً صحيحاً','Entrez un email valide','Enter a valid email'),'⚠️');
    return;
  }
  if(!db){toast(L('لا يوجد اتصال بالسيرفر','Pas de connexion serveur','No server connection'),'⚠️');return;}
  toast(L('جاري الإرسال...','Envoi en cours...','Sending...'),'⏳');
  try{
    const{error}=await db.auth.resetPasswordForEmail(email,{
      redirectTo:window.location.origin+'/customer-app.html'
    });
    if(error){
      console.error('Reset email error:',JSON.stringify(error));
      toast(L('خطأ: ','Erreur: ','Error: ')+(error.message||JSON.stringify(error)),'⚠️');
    }else{
      toast(L('📧 تم إرسال رابط التعيين! تحقق من بريدك','📧 Lien envoyé! Vérifiez votre email','📧 Reset link sent! Check your email'));
      S.authMode='login';
      render();
    }
  }catch(e){
    console.error('Reset email exception:',e);
    toast(L('خطأ: ','Erreur: ','Error: ')+e.message,'⚠️');
  }
}

async function doResetPassword(){
  const pass=S.authF.pass, pass2=S.authF.pass2;
  if(!pass||pass.length<6){
    toast(L('كلمة المرور 6 أحرف على الأقل','Mot de passe min 6 caractères','Password min 6 characters'),'⚠️');
    return;
  }
  if(pass!==pass2){
    toast(L('كلمتا المرور غير متطابقتين','Les mots de passe ne correspondent pas','Passwords don\'t match'),'⚠️');
    return;
  }
  if(!db){toast(L('لا يوجد اتصال بالسيرفر','Pas de connexion serveur','No server connection'),'⚠️');return;}
  // Vérifier qu'on a une session active
  const{data:{session:rs}}=await db.auth.getSession();
  if(!rs){
    toast(L('جلسة منتهية، أعد طلب الرابط','Session expirée, redemandez le lien','Session expired, request link again'),'⚠️');
    S.authMode='forgot';
    render();
    return;
  }
  toast(L('جاري التحديث...','Mise à jour...','Updating...'),'⏳');
  const{error}=await db.auth.updateUser({password:pass});
  if(error){
    console.error('Update password error:',JSON.stringify(error));
    toast(L('خطأ: ','Erreur: ','Error: ')+(error.message||JSON.stringify(error)),'⚠️');
  }else{
    toast(L('🔐 تم تغيير كلمة المرور بنجاح!','🔐 Mot de passe modifié!','🔐 Password changed!'));
    S.authMode='login';
    S.authF.pass=''; S.authF.pass2='';
    await db.auth.signOut();
    S.user=null;
    render();
  }
}

async function placeOrder(){
  if(!S.df.phone||S.df.phone.length!==8){
    toast(L('أدخل رقم هاتف صحيح (8 أرقام)','Entrez un numéro valide (8 chiffres)','Enter a valid phone (8 digits)'),'⚠️');
    return;
  }
  const sub=cartSub(), ids=Object.keys(S.cart);

  // ── Essayer Supabase checkout ──
  if(db && S.user?.id){
    try{
      // 1. Sync cart to Supabase first
      for(const id of ids){
        await db.rpc('upsert_cart_item',{
          p_user_id:S.user.id,
          p_product_id:id,
          p_quantity:S.cart[id]
        });
      }

      // 2. Sync monthly_spend to profiles BEFORE checkout
      // So checkout() reads the correct loyalty tier
      await db.from('profiles')
        .update({ monthly_spend: S.spend })
        .eq('id', S.user.id);

      // 3. Call checkout function with loyalty percentage from frontend
      const loyaltyPct = getDisc();
      const{data,error}=await db.rpc('checkout',{
        p_user_id:    S.user.id,
        p_governorate:S.df.gov,
        p_city:       S.df.city,
        p_area:       S.df.area||'',
        p_street:     S.df.street||'',
        p_house:      S.df.house||'',
        p_phone:      S.df.phone,
        p_coupon_code:S.coupon||null,
        p_loyalty_pct:loyaltyPct,
        p_use_referral_credit:S.useRefCredit&&S.referralCredit>0
      });
      if(error){
        console.log('Checkout error:',error);
        toast(L('خطأ في تأكيد الطلب','Erreur lors de la commande','Order error'),'⚠️');
        return;
      }
      // 3. Get order number
      const{data:orderData}=await db
        .from('orders')
        .select('order_number, total, has_gift')
        .eq('id', data)
        .single();

      const num = orderData?.order_number || 'ND-'+Date.now().toString().slice(-6);
      S.lastOrder={id:num, num, total:sub, hasGift:sub>=200, date:new Date().toISOString(), items:ids};
      S.orderHistory.unshift(S.lastOrder);
      S.spend+=sub; S.modal=null; S.orderDone=true; S.cart={};
      render();
      return;
    }catch(e){
      console.log('Supabase checkout failed, using local:',e);
    }
  }

  // ── Fallback local si pas connecté ──
  const num='ND-'+Date.now().toString().slice(-6);
  S.lastOrder={id:num, num, total:sub, hasGift:sub>=200, date:new Date().toISOString(), items:ids};
  S.orderHistory.unshift(S.lastOrder);
  S.spend+=sub; S.modal=null; S.orderDone=true; S.cart={};
  render();
}

async function doAuth(){
  if(!S.authF.pass||S.authF.pass.length<6){
    toast(L('كلمة المرور 6 أحرف على الأقل','Mot de passe min 6 caractères','Password min 6 characters'),'⚠️');
    return;
  }
  if(!db){
    toast(L('لا يوجد اتصال بالسيرفر','Pas de connexion serveur','No server connection'),'⚠️');
    return;
  }

  if(S.authMode==='register'){
    // ── INSCRIPTION ──
    if(!S.authF.name||S.authF.name.length<3){
      toast(L('أدخل اسمك الكامل','Entrez votre nom complet','Enter your full name'),'⚠️');
      return;
    }
    if(!S.authF.email||!S.authF.email.includes('@')){
      toast(L('أدخل بريداً إلكترونياً صحيحاً','Entrez un email valide','Enter a valid email'),'⚠️');
      return;
    }
    if(!S.authF.phone||S.authF.phone.length!==8){
      toast(L('أدخل رقم هاتف صحيح (8 أرقام)','Numéro invalide (8 chiffres)','Invalid phone (8 digits)'),'⚠️');
      return;
    }

    toast(L('جاري إنشاء الحساب...','Création du compte...','Creating account...'),'⏳');

    const{data,error}=await db.auth.signUp({
      email: S.authF.email,
      password: S.authF.pass,
      options:{
        data:{ full_name: S.authF.name, phone: S.authF.phone }
      }
    });

    if(error){

// ── Détecter reset password AVANT la création du client Supabase ──
const _preHash=window.location.hash||'';
let _isRecovery=_preHash.includes('type=recovery');
let _isExpiredLink=_preHash.includes('error=access_denied');

async function initDB(){
  try{
    db=supabase.createClient(SUPA_URL,SUPA_KEY);

    // ── Charger produits depuis Supabase ──
    const{data:prods}=await db
      .from('products')
      .select('*,categories(slug,name_ar,name_fr)')
      .eq('is_active',true)
      .order('is_featured',{ascending:false});

    if(prods&&prods.length>0){
      // Remplacer les données locales par Supabase
      PRODS.length=0;
      prods.forEach(p=>{
        PRODS.push({
          id:    p.id,
          cat:   p.categories?.slug||'spices',
          e:     p.images?.[0]||'📦',
          ar:    p.name_ar,
          fr:    p.name_fr,
          u:     p.unit||'100g',
          p:     parseFloat(p.price),
          pp:    p.promo_price?parseFloat(p.promo_price):null,
          s:     parseFloat(p.stock_qty||0),
          new:   p.is_new,
          feat:  p.is_featured,
          dar:   p.description_ar||'',
          dfr:   p.description_fr||'',
          ben:   p.benefits_ar?p.benefits_ar.split('\n'):[]
        });
      });
      console.log('✅ Produits chargés depuis Supabase:',PRODS.length);
    }

    // ── Charger zones de livraison ──
    const{data:zones}=await db
      .from('delivery_zones')
      .select('*')
      .eq('is_active',true);

    if(zones&&zones.length>0){
      ZONES.length=0;
      zones.forEach(z=>{
        ZONES.push({
          id:   z.id,
          gov:  z.governorate,
          city: z.city,
          area: z.area||'',
          price:parseFloat(z.price)
        });
      });
      console.log('✅ Zones chargées:',ZONES.length);
    }

    // ── Charger coupons ──
    const{data:coupons}=await db
      .from('coupons')
      .select('*')
      .eq('is_active',true);

    if(coupons&&coupons.length>0){
      coupons.forEach(c=>{
        COUPONS[c.code]={disc:parseFloat(c.discount_pct),min:parseFloat(c.min_order||0)};
      });
      console.log('✅ Coupons chargés:',coupons.length);
    }

    // ── Détecter reset password (pré-vérifié avant createClient) ──
    if(_isRecovery){
      S.authMode='reset';
      S.user=null;
      window.history.replaceState({},'',window.location.pathname);
      render();
      // Ne pas return — laisser onAuthStateChange s'enregistrer pour capter PASSWORD_RECOVERY
    }
    // ── Détecter erreur de lien expiré ──
    if(_isExpiredLink){
      S.authMode='forgot';
      S.user=null;
      window.history.replaceState({},'',window.location.pathname);
      render();
      setTimeout(()=>toast(L('الرابط منتهي الصلاحية، أعد الطلب','Lien expiré, réessayez','Link expired, try again'),'⚠️'),500);
      return;
    }

    // ── Vérifier session existante ──
    const{data:{session}}=await db.auth.getSession();
    if(session&&!_isRecovery){
      S.user={
        id:    session.user.id,
        name:  session.user.user_metadata?.full_name||'مستخدم',
        phone: session.user.user_metadata?.phone||''
      };
      await loadCart();
      await loadReferralData();
    }

    // ── Écouter les changements de statut commandes en temps réel ──
    if (S.user?.id) {
      db.channel('my-orders')
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'orders',
          filter: `user_id=eq.${S.user.id}`
        }, payload => {
          const updated = payload.new;
          const existing = S.orderHistory.find(o => o.id === updated.id);
          if (existing && existing.status !== updated.status) {
            existing.status = updated.status;
            const statusNames = {
              preparing: L('جاري تحضير طلبك!','Commande en préparation!','Order being prepared!'),
              ready: L('طلبك جاهز!','Commande prête!','Order ready!'),
              out_for_delivery: L('🚚 طلبك في الطريق!','🚚 Commande en livraison!','🚚 Order on its way!'),
              delivered: L('✅ تم توصيل طلبك!','✅ Commande livrée!','✅ Order delivered!')
            };
            if (statusNames[updated.status]) {
              toast(statusNames[updated.status]);
            }
            render();
          }
        })
        .subscribe();

      // ── Écouter les notifications admin ──
      db.channel('my-notifs')
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'notifications'
        }, payload => {
          const n = payload.new;
          // Afficher si notification broadcast (user_id = null) ou pour cet utilisateur
          if (!n.user_id || n.user_id === S.user.id) {
            const title = S.lang==='ar' ? n.title_ar : S.lang==='fr' ? n.title_fr : n.title_en;
            const body = S.lang==='ar' ? n.body_ar : S.lang==='fr' ? n.body_fr : n.body_en;
            toast(`🔔 ${title}: ${body}`);
          }
        })
        .subscribe();
    }

    // ── Écouter changements auth ──
    db.auth.onAuthStateChange(async(event,session)=>{
      if(event==='PASSWORD_RECOVERY'){
        // User clicked the reset link in their email
        S.authMode='reset';
        S.user=null;
        render();
        return;
      }
      if(event==='SIGNED_IN'&&session){
        if(S.authMode==='reset')return; // Don't auto-login during password reset
        S.user={
          id:    session.user.id,
          name:  session.user.user_metadata?.full_name||'مستخدم',
          phone: session.user.user_metadata?.phone||''
        };
        await loadCart();
        render();
      }else if(event==='SIGNED_OUT'){
        S.user=null;S.cart={};render();
      }
    });

  }catch(e){
    console.log('DB offline, using local mode:',e.message);
  }
  render();
}

async function loadCart(){

    if(data&&data.length>0){
      S.cart={};
      data.forEach(item=>{S.cart[item.product_id]=item.quantity;});
      console.log('✅ Panier chargé:',Object.keys(S.cart).length,'articles');
    }
  }catch(e){console.log('Cart load error:',e);}
}

          <div class="onb-emoji">${s.emoji}</div>
          <div class="onb-title">${d.t}</div>
          <div class="onb-desc">${d.d}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="onb-dots">
      ${ONBOARDING_SLIDES.map((_,i)=>`<div class="onb-dot ${i===onbSlide?'active':''}"></div>`).join('')}
    </div>
    <div class="onb-footer">
      <button class="onb-skip" onclick="finishOnboarding()">${L('تخطي','Passer','Skip')}</button>
      <button class="onb-next" onclick="nextOnbSlide()">
        ${onbSlide===ONBOARDING_SLIDES.length-1?L('ابدأ التسوق 🛒','Commencer 🛒','Start shopping 🛒'):L('التالي ←','Suivant ←','Next ←')}
      </button>
    </div>`;
}

function nextOnbSlide(){
  if(onbSlide<ONBOARDING_SLIDES.length-1){
    onbSlide++;
    renderOnboarding();
  }else{
    finishOnboarding();
  }
}

function finishOnboarding(){
  localStorage.setItem('nd_onboarding_done','1');
  const el=document.getElementById('onb-overlay');
  if(el)el.remove();
  // Start guided tour after a short delay
  setTimeout(startGuidedTour,600);
}

/* ═══════ GUIDED TOUR ═══════ */
const TOUR_STEPS=[
  {sel:'.srch-inner',
   ar:{t:'🔍 البحث',d:'ابحث عن أي منتج بالاسم — جرّب "كركم" أو "زيت زيتون"'},
   fr:{t:'🔍 Recherche',d:'Cherchez un produit par nom — essayez "curcuma" ou "huile d\'olive"'},
   en:{t:'🔍 Search',d:'Search any product by name — try "turmeric" or "olive oil"'}},
  {sel:'.cats',
   ar:{t:'📂 التصنيفات',d:'تصفح المنتجات حسب الفئة: توابل، أعشاب، مكسرات...'},
   fr:{t:'📂 Catégories',d:'Parcourez par catégorie : épices, herbes, noix...'},
   en:{t:'📂 Categories',d:'Browse by category: spices, herbs, nuts...'}},
  {sel:'.pc',
   ar:{t:'🛒 إضافة للسلة',d:'اضغط + لإضافة المنتج أو اضغط على البطاقة للتفاصيل'},
   fr:{t:'🛒 Ajouter au panier',d:'Appuyez sur + pour ajouter, ou sur la carte pour les détails'},
   en:{t:'🛒 Add to cart',d:'Tap + to add, or tap the card for details'}},
  {sel:'.ni:nth-child(3)',
   ar:{t:'🎁 المكافآت',d:'تابع مستواك واربح خصومات تصل حتى 15%!'},
   fr:{t:'🎁 Récompenses',d:'Suivez votre niveau et gagnez jusqu\'à 15% de remise !'},
   en:{t:'🎁 Rewards',d:'Track your level and earn up to 15% discount!'}},
  {sel:'.hd-btn:first-child',
   ar:{t:'🤖 المساعد الذكي',d:'اسأل المساعد الذكي عن أي منتج أو وصفة!'},
   fr:{t:'🤖 Assistant IA',d:'Demandez à l\'assistant IA pour un produit ou une recette !'},
   en:{t:'🤖 AI Assistant',d:'Ask the AI assistant about any product or recipe!'}}
];

let tourStep=0;

function startGuidedTour(){
  if(localStorage.getItem('nd_tour_done'))return;
  tourStep=0;
  showTourStep();
}

function showTourStep(){
  // Clean previous
  document.querySelectorAll('.tour-backdrop,.tour-highlight,.tour-tip').forEach(e=>e.remove());

  if(tourStep>=TOUR_STEPS.length){
    localStorage.setItem('nd_tour_done','1');
    toast(L('مستعد للتسوق! 🎉','Prêt à magasiner ! 🎉','Ready to shop! 🎉'));
    return;
  }

  const step=TOUR_STEPS[tourStep];
  const el=document.querySelector(step.sel);
  if(!el){tourStep++;showTourStep();return;}

  const rect=el.getBoundingClientRect();
  const lang=S.lang;
  const d=lang==='ar'?step.ar:lang==='fr'?step.fr:step.en;

  // Backdrop
  const backdrop=document.createElement('div');
  backdrop.className='tour-backdrop';
  backdrop.onclick=()=>{};
  document.body.appendChild(backdrop);

  // Highlight
  const hl=document.createElement('div');
  hl.className='tour-highlight';
  hl.style.cssText=`top:${rect.top-4}px;left:${rect.left-4}px;width:${rect.width+8}px;height:${rect.height+8}px`;
  document.body.appendChild(hl);

  // Tooltip
  const tip=document.createElement('div');
  const isAbove=rect.top>200;
  tip.className=`tour-tip ${isAbove?'above':'below'}`;
  tip.innerHTML=`
    <div class="tour-tip-title">${d.t}</div>
    <div class="tour-tip-desc">${d.d}</div>
    <div class="tour-tip-row">
      <div class="tour-tip-dots">${TOUR_STEPS.map((_,i)=>`<span class="${i===tourStep?'active':''}"></span>`).join('')}</div>
      <button class="tour-tip-btn" onclick="nextTourStep()">
        ${tourStep===TOUR_STEPS.length-1?L('انتهى!','Terminé !','Done!'):L('التالي','Suivant','Next')}
      </button>
    </div>`;

  // Position tooltip
  const tipW=260;
  let tipLeft=Math.max(10,rect.left+(rect.width-tipW)/2);
  tipLeft=Math.min(tipLeft,window.innerWidth-tipW-10);

  if(isAbove){
    tip.style.cssText=`top:${rect.top-130}px;left:${tipLeft}px;width:${tipW}px`;
  }else{
    tip.style.cssText=`top:${rect.bottom+12}px;left:${tipLeft}px;width:${tipW}px`;
  }
  document.body.appendChild(tip);
}

function nextTourStep(){
  tourStep++;
  showTourStep();
}

function skipTour(){
  document.querySelectorAll('.tour-backdrop,.tour-highlight,.tour-tip').forEach(e=>e.remove());
  localStorage.setItem('nd_tour_done','1');
}

/* ═══════ TRIGGER ONBOARDING ═══════ */
let _onbShown=false;
const _origRender=render;
render=function(){
  _origRender();
  if(S.user&&shouldShowOnboarding()&&!_onbShown){
    _onbShown=true;
    setTimeout(showOnboarding,400);
  }
};

</script>
</body>
</html>
