<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نكهة الدار</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a4731">
</head>
<body>
<script>
  // Force reload with version timestamp to bypass cache
  const VERSION = '20260609_001';
  const stored = localStorage.getItem('app_version');
  if (stored !== VERSION) {
    localStorage.setItem('app_version', VERSION);
    window.location.href = '/customer-app.html?v=' + VERSION;
  } else {
    window.location.href = '/customer-app.html?v=' + VERSION;
  }
</script>
</body>
</html>
