<style>
:root {
  --sidebar-w: 220px;
  --green: #2d6a4f;
  --green-dark: #1a4731;
  --green-light: #74c69d;
  --green-pale: #d8f3dc;
  --gold: #c9971a;
  --gold-pale: #fef9e7;
  --red: #e63946;
  --orange: #f4a261;
  --blue: #2196f3;
  --bg: #f8f9fa;
  --white: #ffffff;
  --border: #e9ecef;
  --text: #212529;
  --text-mid: #6c757d;
  --shadow: 0 1px 4px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── LAYOUT ── */
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--green-dark);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}

/* ── SIDEBAR ── */
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo-ar{font-family:'Cairo',sans-serif;font-size:18px;font-weight:900;color:var(--gold)}
.logo-en{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.8px;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-nav::-webkit-scrollbar{display:none}
.nav-section-title{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1.5px;text-transform:uppercase;padding:12px 16px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;font-size:13px;font-weight:500;color:rgba(255,255,255,.75);transition:all .18s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff}
.nav-item .nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;margin-right:auto}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.5)}
.admin-info{display:flex;align-items:center;gap:8px}
.admin-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--green-dark)}

/* ── TOPBAR ── */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.page-title{font-size:17px;font-weight:700;color:var(--text)}
.topbar-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .18s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-outline{background:var(--white);color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:var(--bg)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.search-box{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;color:var(--text);width:200px}

/* ── CONTENT ── */
.content{flex:1;padding:20px 24px}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:12px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-label{font-size:12px;font-weight:600;color:var(--text-mid);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stat-value{font-size:24px;font-weight:700;color:var(--text)}
.stat-change{font-size:11px;font-weight:600;margin-top:4px}
.stat-change.up{color:#28a745}
.stat-change.down{color:var(--red)}
.stat-icon{font-size:18px;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── CARD ── */
.card{background:var(--white);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.card-body{padding:16px}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--bg);padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tbody tr:hover{background:#f8f9fa}
tbody tr:last-child td{border-bottom:none}
.td-emoji{font-size:22px;text-align:center;width:40px}

/* ── STATUS BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-received{background:#e3f2fd;color:#1565c0}
.badge-preparing{background:#fff3e0;color:#e65100}
.badge-ready{background:#e8f5e9;color:#2e7d32}
.badge-outfordelivery{background:#ede7f6;color:#4527a0}
.badge-delivered{background:var(--green-pale);color:var(--green)}
.badge-cancelled{background:#ffebee;color:var(--red)}
.badge-instock{background:var(--green-pale);color:var(--green)}
.badge-lowstock{background:#fff3e0;color:#e65100}
.badge-outofstock{background:#ffebee;color:var(--red)}
.badge-starter{background:#eceff1;color:#455a64}
.badge-bronze{background:#fbe9e7;color:#bf360c}
.badge-silver{background:#e0f7fa;color:#006064}
.badge-gold{background:var(--gold-pale);color:var(--gold)}
.badge-vip{background:#f3e5f5;color:#6a1b9a}
.badge-active{background:var(--green-pale);color:var(--green)}
.badge-inactive{background:#f5f5f5;color:var(--text-mid)}

/* ── GRID 2/3 ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:12px;font-weight:600;color:var(--text-mid)}
.form-input,.form-select,.form-textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;color:var(--text);background:var(--white);outline:none;transition:all .18s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(45,106,79,.1)}
.form-textarea{resize:vertical;min-height:80px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:14px;box-shadow:var(--shadow-md);width:100%;max-width:540px;max-height:85vh;overflow-y:auto}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-mid);line-height:1;padding:2px}
.modal-body{padding:20px}

/* ── PROGRESS ── */
.progress-bar{background:var(--border);border-radius:4px;height:6px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .4s}

/* ── CHART WRAP ── */
.chart-wrap{height:220px;position:relative}

/* ── IMAGE UPLOAD ── */
.img-upload-zone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg);position:relative}
.img-upload-zone:hover{border-color:var(--green);background:var(--green-pale)}
.img-upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.img-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.img-preview-item{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:2px solid var(--border)}
.img-preview-item img{width:100%;height:100%;object-fit:cover}
.img-preview-item .img-remove{position:absolute;top:2px;right:2px;width:20px;height:20px;background:var(--red);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.img-uploading{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--gold-pale);border-radius:8px;font-size:12px;color:var(--green-dark);margin-top:8px}

/* ── STATUS SELECT ── */
.status-select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;cursor:pointer;background:var(--white)}

/* ── AUTH ── */
.admin-auth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--green-dark)}
.auth-card{background:var(--white);border-radius:16px;padding:36px;width:100%;max-width:380px;box-shadow:var(--shadow-md)}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo-ar{font-family:'Cairo',sans-serif;font-size:28px;font-weight:900;color:var(--green-dark)}
.auth-logo-sub{font-size:12px;color:var(--text-mid);margin-top:4px}
.auth-title{font-size:18px;font-weight:700;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--text-mid);margin-bottom:20px}
.auth-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px;outline:none;transition:.18s}
.auth-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(45,106,79,.1)}
.auth-submit{width:100%;background:var(--green-dark);color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.18s;margin-top:4px}
.auth-submit:hover{background:var(--green)}
.auth-demo{text-align:center;font-size:12px;color:var(--text-mid);margin-top:12px;cursor:pointer}
.auth-demo span{color:var(--green);font-weight:600}

/* ── DRIVER CARD ── */
.driver-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px}
.driver-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-pale);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--green);flex-shrink:0}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-available{background:#28a745}
.dot-busy{background:var(--orange)}
.dot-offline{background:var(--text-mid)}

/* ── ZONE CARD ── */
.zone-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.zone-price{font-size:18px;font-weight:800;color:var(--green-dark)}

/* ── TABS ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:9px 16px;font-size:13px;font-weight:600;color:var(--text-mid);cursor:pointer;border-bottom:2px solid transparent;transition:.18s;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
</style>

function render() {
  const root = document.getElementById('root');
  if (!adminState.loggedIn) { root.innerHTML = renderLoginPage(); return; }
  root.innerHTML = `
  <div class="layout">
    ${renderSidebar()}
    <div class="main">
      ${renderTopbar()}
      <div class="content">
        ${renderPage()}
      </div>
    </div>
  </div>
  ${adminState.modal ? renderModal() : ''}`;
  bindEvents();
  if (adminState.page === 'dashboard') initCharts();
}

function renderLoginPage() {
  return `
  <div class="admin-auth">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-ar"><img src="/icon-512.png" style="width:80px;height:80px;border-radius:14px;margin-bottom:8px"><br>نكهة الدار</div>
        <div class="auth-logo-sub">Administration — لوحة الإدارة</div>
      </div>
      <div class="auth-title">Connexion Admin</div>
      <div class="auth-sub">Accès réservé aux administrateurs</div>
      <input class="auth-input" type="email" placeholder="Email admin"
        value="${adminState.loginForm.email}" oninput="adminState.loginForm.email=this.value">
      <input class="auth-input" type="password" placeholder="Mot de passe"
        oninput="adminState.loginForm.pass=this.value">
      <button class="auth-submit" onclick="doLogin()">Se connecter</button>
      <div class="auth-demo" onclick="demoLogin()">
        🎮 Accès démo: <span>admin@nakhar.tn / admin123</span>
      </div>
    </div>
  </div>`;
}

function renderPage() {
  switch(adminState.page) {

    case 'orders': return renderOrders();

    case 'categories': return renderCategories();
    case 'promotions': return renderPromotions();
    case 'zones': return renderZones();
    case 'drivers': return renderDrivers();
    case 'customers': return renderCustomers();

    case 'notifications': return renderNotifications();
    case 'analytics': return renderAnalytics();

function initCharts() {
  setTimeout(() => {
    const canvas = document.getElementById('revenue-chart');
    if (!canvas) return;
    if (canvas._chart) canvas._chart.destroy();
    canvas._chart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: MOCK.salesData.labels,
        datasets: [{
          label: 'Revenus (DT)',
          data: MOCK.salesData.revenue,
          borderColor: '#2d6a4f',
          backgroundColor: 'rgba(45,106,79,.08)',
          fill: true,
          tension: 0.4,
          pointRadius: 3,
          pointBackgroundColor: '#2d6a4f'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {legend:{display:false}},
        scales: {
          y: {beginAtZero:false, grid:{color:'#f0f0f0'}, ticks:{font:{size:11}}},
          x: {grid:{display:false}, ticks:{font:{size:10}}}
        }
      }
    });
  }, 100);
}

// ── PRODUCTS ──
function renderProducts() {
  let prods = MOCK.products;
  if (adminState.searchQ) prods = prods.filter(p=>
    p.name.includes(adminState.searchQ) ||
    (p.fr||'').toLowerCase().includes(adminState.searchQ.toLowerCase()) ||
    (p.cat||'').toLowerCase().includes(adminState.searchQ.toLowerCase())
  );
  const stockBadge = p => {
    const s=p.stock||0, u=p.unit||'g';
    if(s===0) return '<span class="badge badge-outofstock">Épuisé</span>';
    if(s<=5)  return `<span class="badge badge-lowstock">⚠️ ${s} ${u}</span>`;
    return `<span class="badge badge-instock">✅ ${s} ${u}</span>`;
  };
  return `
  <div class="card">
    <div style="padding:10px 14px;font-size:13px;color:var(--text-mid);border-bottom:1px solid var(--border)">
      ${prods.length} produit(s) —
      <span style="color:var(--red)">${prods.filter(p=>(p.stock||0)===0).length} épuisé(s)</span>,
      <span style="color:var(--orange)">${prods.filter(p=>(p.stock||0)>0&&(p.stock||0)<=5).length} stock faible</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th></th><th>Nom</th><th>Cat.</th><th>Prix</th><th>Promo</th><th>Stock</th><th>Statut</th><th>Actions</th></tr></thead>
        <tbody>${prods.map(p=>`
        <tr>
          <td class="td-emoji">${(function(s){if(!s||s.length<=4)return s||'📦';return '<img src="'+s+'" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:8px">';})(p.emoji||p.e)}</td>
          <td>
            <div style="font-weight:600">${p.name}</div>
            <div style="font-size:11px;color:var(--text-mid)">${p.fr||''}</div>
          </td>
          <td><span class="badge badge-active" style="font-size:10px">${p.cat}</span></td>
          <td style="font-weight:700">${(p.price||p.p||0).toFixed(3)} DT</td>
          <td>${(p.promoPrice||p.pp)?`<span style="color:var(--red);font-weight:700">${(p.promoPrice||p.pp).toFixed(3)} DT</span>`:`<span style="color:var(--text-mid)">—</span>`}</td>
          <td>${stockBadge(p)}</td>
          <td>
            <button onclick="toggleProductActive('${p.id}')"
              style="padding:4px 10px;border-radius:20px;border:1.5px solid ${p.isActive?'var(--green)':'var(--border)'};
                background:${p.isActive?'var(--green-pale)':'var(--bg)'};font-size:11px;font-weight:600;cursor:pointer;
                color:${p.isActive?'var(--green)':'var(--text-mid)'}">
              ${p.isActive?'● Actif':'○ Inactif'}
            </button>
          </td>
          <td style="white-space:nowrap">
            <button class="btn btn-outline btn-sm" onclick="editProduct('${p.id}')">✏️</button>
            <button class="btn btn-sm" style="background:#ffebee;color:var(--red);border:1px solid #ffcdd2" onclick="deleteProduct('${p.id}')">🗑️</button>
          </td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ═══════════════════════════════════════
// TOAST SYSTEM
// ═══════════════════════════════════════
function toast(msg, type='success') {
  let t = document.getElementById('admin-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'admin-toast';
    t.style.cssText = 'position:fixed;top:70px;right:20px;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:320px';
    document.body.appendChild(t);
  }
  t.style.background = type==='success' ? '#2d6a4f' : type==='error' ? '#e63946' : '#c9971a';
  t.style.color = '#fff';
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transform = 'translateY(0)';
  clearTimeout(t._to);
  t._to = setTimeout(() => { t.style.opacity='0'; }, 2500);
}

async function deleteProduct(id) {
  const p = MOCK.products.find(x => x.id===id);
  if (!p) return;
  if (!confirm(`Supprimer "${p.name}" ?`)) return;
  if (db) {
    try {
      const { error } = await db.from('products').delete().eq('id', id);
      if (error) { toast('Erreur: ' + error.message, 'error'); return; }
      toast(`✅ ${p.name} supprimé`, 'warning');
      await loadAdminData();
    } catch(e) { toast('Erreur: ' + e.message, 'error'); }
  } else {
    MOCK.products = MOCK.products.filter(x => x.id!==id);
    toast(`${p.name} supprimé`,'warning');
    render();
  }
}

async function toggleProductActive(id) {
  const p = MOCK.products.find(x => x.id===id);
  if (!p) return;
  const newState = !p.isActive;
  if (db) {
    try {
      const { error } = await db.from('products').update({ is_active: newState }).eq('id', id);
      if (error) { toast('Erreur: ' + error.message, 'error'); return; }
      p.isActive = newState;
      toast(newState ? '✅ Produit activé' : '⚠️ Produit désactivé');
      render();
    } catch(e) { toast('Erreur: ' + e.message, 'error'); }
  } else {
    p.isActive = newState;
    toast(newState ? 'Produit activé' : 'Produit désactivé');
    render();
  }
}

async function saveProduct() {
  const isEdit = adminState.modal === 'edit-product';
  const nameAr = document.getElementById('prod-name-ar')?.value?.trim();
  const nameFr = document.getElementById('prod-name-fr')?.value?.trim();
  const price  = parseFloat(document.getElementById('prod-price')?.value);
  const stock  = parseFloat(document.getElementById('prod-stock')?.value||0);
  const emoji  = document.getElementById('prod-emoji')?.value?.trim() || '📦';
  const categoryId = document.getElementById('prod-cat')?.value || null;
  const catFr  = document.getElementById('prod-cat')?.selectedOptions?.[0]?.text || 'Épices';
  const promo  = parseFloat(document.getElementById('prod-promo')?.value) || null;
  const unit   = document.getElementById('prod-unit')?.value || '100g';
  const desc   = document.getElementById('prod-desc')?.value?.trim() || '';

  if (!nameAr || !nameFr || isNaN(price)) {
    toast('Remplissez les champs obligatoires (*)','error'); return;
  }

  // Build images array: uploaded images first, emoji as fallback
  const imagesList = pendingImages.length > 0 ? [...pendingImages] : [emoji];

  if (db) {
    try {
      if (isEdit && adminState.editItem) {
        const { error } = await db
          .from('products')
          .update({
            name_ar:      nameAr,
            name_fr:      nameFr,
            name_en:      nameFr,
            description_ar: desc,
            description_fr: desc,
            price:        price,
            promo_price:  promo || null,
            unit:         unit,
            stock_qty:    stock,
            images:       imagesList,
            category_id:  categoryId,
            updated_at:   new Date().toISOString()
          })
          .eq('id', adminState.editItem.id);

        if (error) { toast('Erreur: ' + error.message, 'error'); return; }
        toast('✅ Produit modifié dans Supabase !');

      } else {
        const { data, error } = await db
          .from('products')
          .insert({
            name_ar:       nameAr,
            name_fr:       nameFr,
            name_en:       nameFr,
            description_ar: desc,
            description_fr: desc,
            price:         price,
            promo_price:   promo || null,
            unit:          unit,
            stock_qty:     stock,
            stock_unit:    'kg',
            images:        imagesList,
            category_id:   categoryId,
            is_active:     true,
            is_featured:   false,
            is_new:        true
          })
          .select()
          .single();

        if (error) { toast('Erreur: ' + error.message, 'error'); return; }

        MOCK.products.unshift({
          id: data.id, emoji: imagesList[0], images: imagesList,
          name: nameAr, fr: nameFr, cat: catFr, price,
          promoPrice: promo||null, stock, unit, isActive: true
        });
        toast('✅ Produit ajouté dans Supabase !');
      }

      pendingImages = [];
      await loadAdminData();

    } catch(e) {
      toast('Erreur Supabase: ' + e.message, 'error');
      return;
    }
  } else {
    if (isEdit && adminState.editItem) {
      const p = MOCK.products.find(x => x.id===adminState.editItem.id);
      if (p) { p.name=nameAr; p.fr=nameFr; p.price=price; p.promoPrice=promo||null; p.stock=stock; p.emoji=imagesList[0]; p.images=imagesList; p.cat=catFr; p.unit=unit; }
    } else {
      MOCK.products.unshift({id:'p'+Date.now(), emoji:imagesList[0], images:imagesList, name:nameAr, fr:nameFr, cat:catFr, price, promoPrice:promo||null, stock, unit, isActive:true});
    }
    toast('✅ Produit sauvegardé (mode local)');
  }
  closeModal();
}

async function sendNotification() {
  const title = document.getElementById('notif-title')?.value?.trim();
  const body  = document.getElementById('notif-body')?.value?.trim();
  const target = document.querySelector('#notif-dest')?.value || 'all';
  if (!title || !body) { toast('Titre et message obligatoires','error'); return; }

  if (db) {
    try {
      // Send to all users (user_id = NULL means broadcast)
      const { error } = await db.from('notifications').insert({
        user_id: null,
        title_ar: title,
        title_fr: title,
        title_en: title,
        body_ar: body,
        body_fr: body,
        body_en: body,
        type: 'admin_push',
        is_read: false
      });
      if (error) { toast('Erreur: ' + error.message, 'error'); return; }
      toast(`✅ Notification "${title}" envoyée à tous les clients !`);
      playOrderSound();
    } catch(e) {
      toast('Erreur: ' + e.message, 'error');
      return;
    }
  } else {
    toast(`✅ Notification "${title}" envoyée (mode local)`);
  }
  document.getElementById('notif-title').value='';
  document.getElementById('notif-body').value='';
}

  const statuses = ['available','busy','offline'];

function assignOrderToDriver(driverName) {
  const pending = MOCK.orders.filter(o=>!o.driver&&o.status==='ready');
  if (!pending.length) { toast('Aucune commande prête à assigner','warning'); return; }
  pending[0].driver = driverName;
  pending[0].status = 'out_for_delivery';
  MOCK.stats.pendingOrders = Math.max(0,MOCK.stats.pendingOrders-1);
  toast(`Commande ${pending[0].id} assignée à ${driverName}`);
  render();
}

/* ═══════════════ IMAGE UPLOAD ═══════════════ */
let pendingImages = []; // URLs of images pending for current product form
let isUploading = false;

async function handleImageUpload(event) {
  const files = event.target.files;
  if (!files || files.length === 0) return;
  if (!db) { toast('Connexion Supabase requise pour uploader','error'); return; }

  isUploading = true;
  updateImagePreview();

  for (const file of files) {
    // Validate
    if (!file.type.startsWith('image/')) { toast('Fichier non image ignoré','warning'); continue; }
    if (file.size > 5 * 1024 * 1024) { toast('Image trop grande (max 5 MB)','error'); continue; }

    // Generate unique filename
    const ext = file.name.split('.').pop().toLowerCase();
    const filename = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const path = `products/${filename}`;

    try {
      const { data, error } = await db.storage
        .from('product-images')
        .upload(path, file, { cacheControl: '3600', upsert: false });

      if (error) { toast('Erreur upload: ' + error.message, 'error'); continue; }

      // Get public URL
      const { data: urlData } = db.storage
        .from('product-images')
        .getPublicUrl(path);

      pendingImages.push(urlData.publicUrl);
      toast('Image uploadée !');
    } catch(e) {
      toast('Erreur: ' + e.message, 'error');
    }
  }

  isUploading = false;
  updateImagePreview();
  event.target.value = ''; // reset input
}

function removeImage(index) {
  const removed = pendingImages.splice(index, 1)[0];
  // Optionally delete from storage
  if (db && removed) {
    const path = removed.split('/product-images/')[1];
    if (path) db.storage.from('product-images').remove([path]).catch(()=>{});
  }
  updateImagePreview();
}

function updateImagePreview() {
  const container = document.getElementById('img-preview-container');
  if (!container) return;
  container.innerHTML = `
    ${pendingImages.map((url, i) => `
      <div class="img-preview-item">
        <img src="${url}" alt="produit">
        <button class="img-remove" onclick="removeImage(${i})">✕</button>
      </div>
    `).join('')}
    ${isUploading ? '<div class="img-uploading">⏳ Upload en cours...</div>' : ''}
  `;
}

async function loadAdminData() {
  if (!db) return;
  try {
    // Load orders with profiles AND order items

      .from('orders')
      .select('*, profiles(full_name, phone), order_items(name_ar, name_fr, unit_price, quantity, subtotal)')
      .order('created_at', { ascending: false });

    if (ordErr) console.log('Orders error:', ordErr.message);

    if (orders && orders.length > 0) {
      MOCK.orders = orders.map(o => ({
        id: o.order_number || o.id,
        real_id: o.id,
        customer: o.profiles?.full_name || o.customer_phone || 'Client',
        phone: o.customer_phone || o.profiles?.phone || '—',
        total: parseFloat(o.total),
        status: o.status,
        date: o.created_at?.split('T')[0],
        zone: `${o.city||'—'}${o.area?' - '+o.area:''}`,
        driver: o.driver_id || null,
        order_items: o.order_items || [],
        items: o.order_items?.length || 0,
        has_gift: o.has_gift,
        governorate: o.governorate,
        city: o.city,
        area: o.area,
        street: o.street,
        house: o.house_number
      }));
      MOCK.stats.totalOrders = orders.length;
      MOCK.stats.pendingOrders = orders.filter(o => o.status==='received'||o.status==='preparing').length;
      MOCK.stats.deliveredOrders = orders.filter(o => o.status==='delivered').length;
      const todayStr = new Date().toISOString().split('T')[0];
      const todayOrders = orders.filter(o => o.created_at?.startsWith(todayStr));
      MOCK.stats.todaySales = todayOrders.reduce((s,o) => s + parseFloat(o.total||0), 0);
      const weekAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
      MOCK.stats.weekSales = orders.filter(o=>o.created_at>=weekAgo).reduce((s,o)=>s+parseFloat(o.total||0),0);
      console.log('✅ Orders loaded:', orders.length);
    }

    // Load products
    const { data: prods } = await db
      .from('products')
      .select('*, categories(name_fr)')
      .order('created_at', { ascending: false });

    if (prods && prods.length > 0) {
      MOCK.products = prods.map(p => ({
        id: p.id,
        emoji: p.images?.[0] || '📦',
        images: p.images || [],
        name: p.name_ar,
        fr: p.name_fr,
        en: p.name_en || '',
        cat: p.categories?.name_fr || 'Épices',
        category_id: p.category_id,
        price: parseFloat(p.price),
        promoPrice: p.promo_price ? parseFloat(p.promo_price) : null,
        stock: parseFloat(p.stock_qty||0),
        unit: p.unit || '100g',
        isActive: p.is_active,
        description: p.description_ar || ''
      }));
      console.log('✅ Products loaded:', prods.length);
    }

    // Load categories from Supabase
    const { data: cats } = await db.from('categories').select('*').order('sort_order');
    if (cats && cats.length > 0) {
      MOCK.categories = cats.map(c => ({
        id: c.id, name: c.name_fr, nameAr: c.name_ar, nameEn: c.name_en,
        icon: c.icon_url || '🏷️', count: 0, isActive: c.is_active
      }));
      // Count products per category
      MOCK.products.forEach(p => {
        const cat = MOCK.categories.find(c => c.id === p.category_id);
        if (cat) cat.count++;
      });
      console.log('✅ Categories loaded:', cats.length);
    }

    // Load zones
    const { data: zones } = await db.from('delivery_zones').select('*');
    if (zones && zones.length > 0) {
      MOCK.zones = zones.map(z => ({
        id: z.id, gov: z.governorate, city: z.city, area: z.area||'',
        price: parseFloat(z.price), isActive: z.is_active
      }));
    }

    // Load coupons
    const { data: coupons } = await db.from('coupons').select('*');
    if (coupons && coupons.length > 0) {
      MOCK.coupons = coupons.map(c => ({
        code: c.code, disc: parseFloat(c.discount_pct), min: parseFloat(c.min_order||0),
        uses: c.current_uses||0, maxUses: c.max_uses||1000,
        valid: c.valid_until?.split('T')[0]||'—', isActive: c.is_active
      }));
    }

    // Load customers
    const { data: profiles } = await db
      .from('profiles')
      .select('*')
      .order('created_at', { ascending: false });

    if (profiles && profiles.length > 0) {
      MOCK.customers = profiles.map(p => ({
        id: p.id,
        name: p.full_name || 'Client',
        phone: p.phone || '—',
        orders: MOCK.orders.filter(o=>o.customer===p.full_name).length,
        spend: parseFloat(p.total_spend||0),
        tier: p.loyalty_tier || 'starter',
        lastOrder: MOCK.orders.find(o=>o.customer===p.full_name)?.date || '—'
      }));
    }

  } catch(e) { console.log('Admin data error:', e.message); }
}

// ── SON NOTIFICATION COMMANDE ──
function playOrderSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Mélodie : 3 bips rapides puis 1 long
    const notes = [
      {freq: 880, start: 0, dur: 0.12},
      {freq: 880, start: 0.15, dur: 0.12},
      {freq: 880, start: 0.30, dur: 0.12},
      {freq: 1174, start: 0.50, dur: 0.35}
    ];
    notes.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = n.freq;
      gain.gain.setValueAtTime(0.4, ctx.currentTime + n.start);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + n.start + n.dur);
      osc.start(ctx.currentTime + n.start);
      osc.stop(ctx.currentTime + n.start + n.dur + 0.05);
    });
  } catch(e) { console.log('Sound not available'); }
}

// ── REALTIME — nouvelles commandes ──
function listenOrders() {
  if (!db) return;
  try {
    // Realtime subscription for new orders
    db.channel('admin-orders')
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'orders'
      }, async payload => {
        const o = payload.new;
        // Reload all data to get fresh state
        await loadAdminData();
        // Sound notification
        playOrderSound();
        toast('🔔 Nouvelle commande reçue ! ' + (o.order_number || ''));
        render();
      })
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'orders'
      }, async payload => {
        // Update order status in local data
        const o = payload.new;
        const existing = MOCK.orders.find(x => x.real_id === o.id || x.id === o.order_number);
        if (existing) {
          existing.status = o.status;
          MOCK.stats.pendingOrders = MOCK.orders.filter(x=>x.status==='received'||x.status==='preparing').length;
          render();
        }
      })
      .subscribe(status => {
        console.log('Realtime status:', status);
        if (status === 'SUBSCRIBED') {
          console.log('✅ Realtime connecté — écoute des nouvelles commandes');
        }
      });

    // Also poll every 30 seconds as fallback
    setInterval(async () => {
      await loadAdminData();
      render();
    }, 30000);

  } catch(e) { console.log('Realtime not available:', e.message); }
}
